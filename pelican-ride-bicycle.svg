<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Riding a Bicycle</title>
  <desc id="desc">A playful cartoon pelican riding a blue bicycle with a sunny sky and simple ground.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bdefff"/>
      <stop offset="100%" stop-color="#eefcff"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7a8"/>
      <stop offset="100%" stop-color="#ffd45a"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#16425b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#sky)"/>
  <circle cx="760" cy="95" r="48" fill="url(#sun)"/>
  <path d="M0 490 C140 455 245 510 390 482 C560 448 690 470 900 438 L900 600 L0 600 Z" fill="#9be38f"/>
  <path d="M0 510 C190 480 270 535 430 506 C610 474 710 496 900 466" fill="none" stroke="#64bd72" stroke-width="8" stroke-linecap="round" opacity="0.55"/>

  <!-- Bicycle wheels -->
  <g filter="url(#shadow)">
    <circle cx="285" cy="410" r="92" fill="none" stroke="#263447" stroke-width="15"/>
    <circle cx="615" cy="410" r="92" fill="none" stroke="#263447" stroke-width="15"/>
    <circle cx="285" cy="410" r="70" fill="none" stroke="#8fd5ff" stroke-width="4" opacity="0.8"/>
    <circle cx="615" cy="410" r="70" fill="none" stroke="#8fd5ff" stroke-width="4" opacity="0.8"/>

    <!-- Spokes -->
    <g stroke="#6f7d8d" stroke-width="3" stroke-linecap="round">
      <path d="M285 410 L285 318 M285 410 L285 502 M285 410 L193 410 M285 410 L377 410"/>
      <path d="M285 410 L220 345 M285 410 L350 475 M285 410 L350 345 M285 410 L220 475"/>
      <path d="M615 410 L615 318 M615 410 L615 502 M615 410 L523 410 M615 410 L707 410"/>
      <path d="M615 410 L550 345 M615 410 L680 475 M615 410 L680 345 M615 410 L550 475"/>
    </g>

    <!-- Bicycle frame -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M285 410 L405 292 L505 410 L285 410 L445 410 L405 292" stroke="#1f88d1" stroke-width="16"/>
      <path d="M445 410 L615 410 L528 292 L405 292" stroke="#1f88d1" stroke-width="16"/>
      <path d="M528 292 L566 238" stroke="#263447" stroke-width="12"/>
      <path d="M566 238 C600 225 625 227 650 244" stroke="#263447" stroke-width="10"/>
      <path d="M405 292 L382 235" stroke="#263447" stroke-width="12"/>
      <path d="M350 233 L410 233" stroke="#263447" stroke-width="11"/>
      <circle cx="445" cy="410" r="17" fill="#263447"/>
      <path d="M445 410 L485 382" stroke="#263447" stroke-width="8"/>
      <path d="M445 410 L407 441" stroke="#263447" stroke-width="8"/>
      <path d="M492 379 L510 368" stroke="#263447" stroke-width="7"/>
      <path d="M400 447 L381 456" stroke="#263447" stroke-width="7"/>
    </g>
  </g>

  <!-- Pelican rider -->
  <g filter="url(#shadow)">
    <!-- Legs and feet -->
    <g fill="none" stroke="#f5a623" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M443 310 C432 340 435 374 445 410"/>
      <path d="M468 314 C492 340 503 360 510 376"/>
      <path d="M445 410 L407 441"/>
      <path d="M510 376 L538 377"/>
    </g>

    <!-- Body -->
    <ellipse cx="445" cy="238" rx="95" ry="112" transform="rotate(-10 445 238)" fill="#f7fbff" stroke="#d8e6ef" stroke-width="5"/>
    <path d="M374 220 C340 255 342 304 386 326 C401 290 407 250 374 220 Z" fill="#eef5fa" stroke="#d8e6ef" stroke-width="4"/>
    <path d="M489 167 C540 195 551 246 529 292 C505 255 490 213 489 167 Z" fill="#e7f0f7" stroke="#d8e6ef" stroke-width="4"/>

    <!-- Neck and head -->
    <path d="M456 153 C466 118 499 92 536 96 C576 100 599 129 596 162 C592 207 540 218 508 194 C481 174 452 173 456 153 Z" fill="#f7fbff" stroke="#d8e6ef" stroke-width="5"/>
    <circle cx="558" cy="134" r="7" fill="#18222f"/>
    <path d="M596 153 C650 157 698 179 725 211 C682 218 625 208 587 180 Z" fill="#f5a623" stroke="#d98a00" stroke-width="4" stroke-linejoin="round"/>
    <path d="M602 171 C645 176 682 188 708 206 C671 211 627 204 592 185 Z" fill="#ffd27a" opacity="0.9"/>
    <path d="M594 153 C632 145 674 150 710 174 C666 174 628 170 596 162 Z" fill="#ffbf45" stroke="#d98a00" stroke-width="3" stroke-linejoin="round"/>

    <!-- Hat -->
    <path d="M512 94 C521 70 564 65 581 91 L582 101 C561 93 536 91 512 104 Z" fill="#2a9d8f" stroke="#1e746a" stroke-width="4"/>
    <path d="M493 107 C527 91 566 91 608 106" fill="none" stroke="#1e746a" stroke-width="8" stroke-linecap="round"/>

    <!-- Wing holding handlebar -->
    <path d="M500 232 C538 228 563 234 592 250" fill="none" stroke="#d8e6ef" stroke-width="28" stroke-linecap="round"/>
    <path d="M592 250 C612 253 630 250 650 244" fill="none" stroke="#f7fbff" stroke-width="18" stroke-linecap="round"/>

    <!-- Tail feathers -->
    <path d="M356 250 C318 235 296 212 288 182 C325 188 351 205 371 234 Z" fill="#eef5fa" stroke="#d8e6ef" stroke-width="4"/>
    <path d="M364 272 C324 274 293 260 271 232 C311 224 346 235 374 254 Z" fill="#f7fbff" stroke="#d8e6ef" stroke-width="4"/>
  </g>

  <!-- Motion lines -->
  <g fill="none" stroke="#3aaed8" stroke-width="7" stroke-linecap="round" opacity="0.45">
    <path d="M92 335 H190"/>
    <path d="M70 374 H168"/>
    <path d="M122 423 H205"/>
  </g>
</svg>
