<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Panda Riding a Bicycle</title>
  <desc id="desc">A cheerful cartoon panda rides a coral-red bicycle through green hills and bamboo.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bdeeff"/>
      <stop offset="100%" stop-color="#f4fdff"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8e986"/>
      <stop offset="100%" stop-color="#72c56b"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#163541" flood-opacity="0.2"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Landscape -->
  <rect width="900" height="600" fill="url(#sky)"/>
  <circle cx="754" cy="100" r="51" fill="#ffe075" opacity="0.95"/>
  <circle cx="754" cy="100" r="66" fill="#ffe89c" opacity="0.25" filter="url(#soft)"/>
  <g fill="#ffffff" opacity="0.82">
    <path d="M83 126 C95 99 130 98 143 120 C161 94 204 101 210 132 H83 Z"/>
    <path d="M608 170 C619 146 649 143 664 162 C680 137 719 145 726 174 H608 Z"/>
  </g>
  <path d="M0 420 C120 328 238 371 332 432 C444 332 589 344 697 426 C775 368 840 365 900 397 V600 H0 Z" fill="url(#hill)"/>
  <path d="M0 480 C142 435 263 475 385 456 C539 431 681 470 900 424 V600 H0 Z" fill="#62b96c"/>
  <path d="M0 528 C190 497 315 542 468 511 C630 479 753 512 900 485 V600 H0 Z" fill="#429d5b"/>
  <ellipse cx="450" cy="522" rx="298" ry="30" fill="#1f6047" opacity="0.18"/>

  <!-- Bamboo -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke="#378f55" stroke-width="12">
      <path d="M92 458 C100 359 92 259 108 161"/>
      <path d="M154 439 C145 352 157 278 148 205"/>
      <path d="M820 431 C809 343 824 261 816 183"/>
    </g>
    <g stroke="#226f42" stroke-width="4">
      <path d="M96 384 L119 365 M99 307 L80 287 M104 232 L126 214"/>
      <path d="M150 375 L126 352 M153 303 L178 282 M150 246 L128 226"/>
      <path d="M815 362 L790 341 M817 294 L844 270 M818 230 L792 210"/>
    </g>
    <g fill="#48aa60" stroke="#267a45" stroke-width="3">
      <ellipse cx="126" cy="354" rx="25" ry="10" transform="rotate(-25 126 354)"/>
      <ellipse cx="75" cy="276" rx="26" ry="10" transform="rotate(30 75 276)"/>
      <ellipse cx="134" cy="202" rx="26" ry="10" transform="rotate(-24 134 202)"/>
      <ellipse cx="118" cy="342" rx="24" ry="9" transform="rotate(35 118 342)"/>
      <ellipse cx="183" cy="273" rx="26" ry="10" transform="rotate(-30 183 273)"/>
      <ellipse cx="123" cy="217" rx="25" ry="10" transform="rotate(27 123 217)"/>
      <ellipse cx="784" cy="331" rx="27" ry="10" transform="rotate(31 784 331)"/>
      <ellipse cx="850" cy="260" rx="26" ry="10" transform="rotate(-30 850 260)"/>
      <ellipse cx="785" cy="200" rx="25" ry="10" transform="rotate(29 785 200)"/>
    </g>
  </g>

  <!-- Bicycle -->
  <g filter="url(#shadow)">
    <g fill="#f9fdff" stroke="#26333f" stroke-width="14">
      <circle cx="282" cy="426" r="91"/>
      <circle cx="624" cy="426" r="91"/>
    </g>
    <g fill="none" stroke="#92a5af" stroke-width="3" opacity="0.82">
      <path d="M282 335 V517 M191 426 H373 M218 362 L346 490 M346 362 L218 490"/>
      <path d="M624 335 V517 M533 426 H715 M560 362 L688 490 M688 362 L560 490"/>
    </g>
    <g fill="#26333f">
      <circle cx="282" cy="426" r="11"/>
      <circle cx="624" cy="426" r="11"/>
    </g>
    <g fill="none" stroke="#ef5b5b" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M282 426 L401 303 L492 426 Z"/>
      <path d="M401 303 L527 303 L492 426 L624 426"/>
      <path d="M527 303 L624 426"/>
    </g>
    <g fill="none" stroke="#26333f" stroke-linecap="round" stroke-linejoin="round">
      <path d="M527 303 L562 249" stroke-width="12"/>
      <path d="M558 250 C591 239 622 243 649 260" stroke-width="10"/>
      <path d="M402 303 L386 252" stroke-width="11"/>
      <path d="M354 250 H410" stroke-width="13"/>
      <circle cx="492" cy="426" r="19" fill="#26333f" stroke="none"/>
      <path d="M492 426 L526 394 M492 426 L455 458" stroke-width="8"/>
      <path d="M520 396 L540 388 M448 463 L428 470" stroke-width="7"/>
    </g>
    <path d="M425 318 Q481 349 526 317" fill="none" stroke="#ff8585" stroke-width="5" opacity="0.7"/>
  </g>

  <!-- Panda rider -->
  <g filter="url(#shadow)">
    <!-- Scarf behind the rider -->
    <path d="M366 178 C321 176 285 155 246 127 C267 168 295 196 356 203 Z" fill="#f2b544" stroke="#c98622" stroke-width="4"/>
    <path d="M270 146 L245 177 L281 176" fill="#f2b544" stroke="#c98622" stroke-width="4" stroke-linejoin="round"/>

    <!-- Legs -->
    <g fill="none" stroke="#20282e" stroke-width="25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M421 311 C438 345 463 384 492 426"/>
      <path d="M466 307 C485 329 507 360 526 394"/>
    </g>
    <g fill="none" stroke="#151b20" stroke-width="13" stroke-linecap="round">
      <path d="M492 426 L455 458"/>
      <path d="M526 394 L548 391"/>
    </g>

    <!-- Body and belly -->
    <ellipse cx="431" cy="259" rx="87" ry="103" transform="rotate(-8 431 259)" fill="#fbfbf7" stroke="#20282e" stroke-width="6"/>
    <ellipse cx="429" cy="280" rx="53" ry="65" transform="rotate(-8 429 280)" fill="#f2f0e9"/>
    <path d="M378 231 C347 256 346 299 379 324 C396 298 405 262 397 237 Z" fill="#20282e"/>

    <!-- Head and ears -->
    <circle cx="391" cy="135" r="34" fill="#20282e"/>
    <circle cx="511" cy="137" r="34" fill="#20282e"/>
    <ellipse cx="451" cy="159" rx="82" ry="72" fill="#fbfbf7" stroke="#20282e" stroke-width="6"/>
    <ellipse cx="416" cy="155" rx="24" ry="31" transform="rotate(22 416 155)" fill="#20282e"/>
    <ellipse cx="486" cy="155" rx="24" ry="31" transform="rotate(-22 486 155)" fill="#20282e"/>
    <ellipse cx="418" cy="155" rx="8" ry="10" fill="#fbfbf7"/>
    <ellipse cx="484" cy="155" rx="8" ry="10" fill="#fbfbf7"/>
    <circle cx="420" cy="153" r="4" fill="#20282e"/>
    <circle cx="482" cy="153" r="4" fill="#20282e"/>
    <ellipse cx="451" cy="181" rx="15" ry="11" fill="#20282e"/>
    <path d="M451 190 C446 204 426 204 419 193 M451 190 C456 204 476 204 483 193" fill="none" stroke="#20282e" stroke-width="4" stroke-linecap="round"/>
    <path d="M435 207 C446 216 459 216 470 207" fill="none" stroke="#e26b6b" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#e6b49e" stroke-width="3" stroke-linecap="round" opacity="0.65">
      <path d="M395 186 L384 188 M397 192 L387 197 M506 186 L517 188 M504 192 L514 197"/>
    </g>

    <!-- Scarf knot -->
    <path d="M375 194 C397 210 438 219 477 212 L471 232 C432 239 396 228 368 209 Z" fill="#f2b544" stroke="#c98622" stroke-width="4"/>
    <circle cx="375" cy="205" r="13" fill="#ffc95f" stroke="#c98622" stroke-width="4"/>

    <!-- Arms holding the handlebar -->
    <path d="M472 248 C514 246 547 258 575 278" fill="none" stroke="#20282e" stroke-width="29" stroke-linecap="round"/>
    <path d="M568 276 C591 279 619 272 644 261" fill="none" stroke="#20282e" stroke-width="18" stroke-linecap="round"/>
    <circle cx="644" cy="261" r="11" fill="#20282e"/>
    <path d="M483 248 C515 251 540 260 559 274" fill="none" stroke="#3c474d" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <!-- Tiny helmet -->
    <path d="M394 104 C405 62 480 48 514 93 C472 84 431 87 394 104 Z" fill="#42a7c8" stroke="#256d88" stroke-width="5"/>
    <path d="M420 88 C441 72 473 71 493 86" fill="none" stroke="#80d1e8" stroke-width="6" stroke-linecap="round"/>
    <path d="M386 106 C430 87 478 85 525 101" fill="none" stroke="#256d88" stroke-width="9" stroke-linecap="round"/>
    <path d="M511 102 C520 119 519 137 511 149" fill="none" stroke="#256d88" stroke-width="5"/>
  </g>

  <!-- Foreground motion and flowers -->
  <g fill="none" stroke="#dff6ff" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <path d="M44 363 H151"/>
    <path d="M65 404 H174"/>
    <path d="M741 358 H844"/>
  </g>
  <g>
    <g transform="translate(190 520)">
      <circle r="7" fill="#ffd45a"/><circle cx="-8" cy="-5" r="7" fill="#fff"/><circle cx="8" cy="-5" r="7" fill="#fff"/><circle cx="-6" cy="8" r="7" fill="#fff"/><circle cx="7" cy="8" r="7" fill="#fff"/>
    </g>
    <g transform="translate(745 503)">
      <circle r="7" fill="#ffd45a"/><circle cx="-8" cy="-5" r="7" fill="#ffb6c8"/><circle cx="8" cy="-5" r="7" fill="#ffb6c8"/><circle cx="-6" cy="8" r="7" fill="#ffb6c8"/><circle cx="7" cy="8" r="7" fill="#ffb6c8"/>
    </g>
  </g>
</svg>
